name: joke-daemon
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        echo "Preparing to build joke-daemon..."
    build:
      - |
        # Compile the joke daemon from /pkg source
        gcc -o joke-daemon /pkg/joke-daemon.c -static -Wall -Wextra

        # Verify the binary was created
        ls -lh joke-daemon
    install:
      - |
        # Create the rootfs directory structure
        mkdir -p /rootfs/usr/local/lib/containers/joke-daemon
        mkdir -p /rootfs/usr/local/etc/containers

        # Install the daemon in the service directory
        install -m 755 joke-daemon /rootfs/usr/local/lib/containers/joke-daemon/joke-daemon

        # Install the service definition from /pkg
        install -m 644 /pkg/joke-daemon.yaml /rootfs/usr/local/etc/containers/joke-daemon.yaml

        # Verify installation
        ls -la /rootfs/usr/local/lib/containers/joke-daemon/
        ls -la /rootfs/usr/local/etc/containers/
    test:
      - |
        # Basic validation - check that the binary exists and is executable
        test -f /rootfs/usr/local/lib/containers/joke-daemon/joke-daemon
        test -x /rootfs/usr/local/lib/containers/joke-daemon/joke-daemon

        # Run the extensions validator
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
